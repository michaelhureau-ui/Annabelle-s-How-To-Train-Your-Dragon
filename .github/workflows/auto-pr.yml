name: Auto-open PR for Claude branches

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open PR if none exists
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              base: 'main',
              state: 'open',
            });
            if (prs.length === 0) {
              const { data: commits } = await github.rest.repos.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: branch,
                per_page: 1,
              });
              const title = commits[0]?.commit?.message?.split('\n')[0] || branch;
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: branch,
                base: 'main',
                title: title,
                body: '🤖 Auto-opened by Claude Code\n\nhttps://claude.ai/code/session_01PGHLK3ZRSjnzy11NrujZmu',
              });
              console.log('PR created for branch: ' + branch);
            } else {
              console.log('PR already exists: #' + prs[0].number);
            }
